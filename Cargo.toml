[package]
name = "claude-poke"
version = "0.1.0"
edition = "2021"

[features]
default = ["tray"]
tray = ["dep:ksni"]

[dependencies]
winit = "0.30"
pixels = "0.17"
image = { version = "0.25", features = ["png"] }
tiny_http = "0.12"
sysinfo = "0.33"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
anyhow = "1"
log = "0.4"
env_logger = "0.11"
raw-window-handle = "0.6"

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["winuser", "wingdi"] }

[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.26"
objc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3", optional = true, features = ["blocking"] }
wayland-client = "0.31"
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
smithay-client-toolkit = { version = "0.19", features = ["calloop"] }
calloop = "0.13"

[profile.release]
opt-level = 3
lto = true
