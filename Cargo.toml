[package]
name = "claude-poke"
version = "0.1.0"
edition = "2021"

[features]
default = []
tray = ["dep:tray-icon"]

[dependencies]
winit = "0.30"
pixels = "0.17"
image = { version = "0.25", features = ["png"] }
notify = "8"
tray-icon = { version = "0.24", optional = true }
sysinfo = "0.33"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
anyhow = "1"
log = "0.4"
env_logger = "0.11"

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["winuser", "wingdi"] }

[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.26"
objc = "0.2"

[profile.release]
opt-level = 3
lto = true
